name: Release

# Publishing is a tag, never a merge: push `vX.Y.Z` from main and this builds,
# checks and uploads that exact commit. The `pypi` environment accepts only
# `v*` tags (its deployment rule), so no branch or other ref can publish, and
# PyPI accepts the upload only from this workflow, in this repo, in that
# environment (Trusted Publishing — no token is stored anywhere). There is no
# manual approval: the tag is the decision, so restrict who may create `v*`
# tags (a tag ruleset). Once PyPI has the release, a second job creates the
# matching GitHub Release with generated notes.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kalanos/
    permissions:
      contents: read
      id-token: write # lets PyPI verify this run via OIDC
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check the tag matches pyproject.toml and CITATION.cff
        run: uv run python scripts/check_release.py --tag "$GITHUB_REF_NAME"

      - name: Run the test suite
        run: uv run pytest

      - name: Run installed-package integration tests
        run: uv run pytest -m integration

      - name: Build the sdist and wheel
        run: uv build

      - name: Check the distributions render on PyPI
        run: uvx twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: uv run --isolated --no-project --with dist/*.whl kalanos --help

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub Release
    needs: publish # only after PyPI accepted the upload
    runs-on: ubuntu-latest
    # A separate job so write access to the repo is never held by the job that
    # runs the test suite and build. It needs no checkout: `gh` works against
    # the repo by name.
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
            exit 0
          fi
          flags=(--latest)
          if [[ "$TAG" =~ rc[0-9]+$ ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "Kalanos ${TAG#v}" \
            --generate-notes \
            "${flags[@]}"
