name: Setup
description: Install uv and sync dependencies from the lockfile

inputs:
  python-version:
    description: Python version to install and sync against. Defaults to the version pinned in uv.lock.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies from the lockfile
      run: uv sync --locked
      shell: bash
