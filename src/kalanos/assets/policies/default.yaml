# The policy Kalanos grades with when a user supplies none of their own.
#
# docs/METRICS.md is the source of truth for every value below.
# A threshold, weight or limit that file marks "to define"
# must never appear here as a number.
# A value it marks "candidate" may ship as the working default,
# provided its entry below carries a comment marking it unconfirmed —
# see "Adding a metric" in that file before touching this one.

schema_version: 1

metrics:
  # Recorded-axis diagnostics are report-only. They establish no capture quality.
  timing.recorded_hz: {}
  timing.recorded_dt_spread_ms: {}
  timing.recorded_drop_estimate: {}

  # Both bounds decided: good < 1%, bad > 5%.
  timing.drop_rate:
    thresholds:
      default:
        good: 0.01
        bad: 0.05

  # Good bound only, at 100 Hz specifically, and unconfirmed against real
  # recordings; bad is still to define. Kept one-sided on purpose: an
  # absolute-ms band only fits ~100 Hz, and a two-sided ms band grades the
  # jittery-clock fixture (armD) that the corpus builds to stay ungraded.
  timing.dt_jitter_ms:
    thresholds:
      default:
        good: 5.0

  # No bound decided; docs/METRICS.md marks it to define. Measured and shown in
  # every report, but it grades nothing until a band is settled against real
  # recordings.
  timing.monotonic_violations: {}

  # Calibrated on pusht, cmu_stretch and aloha_static_towel: good just below the worst clean camera stream, bad at the median stream blurred by a 5x5 box.
  vision.sharpness_score:
    higher_is_better: true
    thresholds:
      default:
        good: 0.74
        bad: 0.55

  # Calibrated on pusht, cmu_stretch and aloha_static_towel: good at the worst clean camera stream, bad at the median stream with 40% of its frames clipped.
  vision.exposure_shift_pct:
    thresholds:
      default:
        good: 10.0
        bad: 40.0

  # Reported, never graded: a white simulator scene and an overexposed camera
  # read alike here; Report.cameras compares each camera across episodes instead.
  vision.exposure_level: {}

  # Candidate: rda's review (1%) and exclusion (5%) bounds, unconfirmed against
  # real recordings. A count mismatch breaks a declared invariant with direct
  # evidence, so it blocks through the contract route without a calibration
  # manifest; the band itself stays candidate.
  vision.frame_count_vs_timebase:
    route: contract
    thresholds:
      default:
        good: 0.01
        bad: 0.05

  # Reported, never graded: no band is decided.
  vision.pts_defect_pct:
    report_only: true

  # Calibrated on pusht, cmu_stretch and aloha_static_towel: no clean camera stream froze, so any counted freeze leaves good (the shortest reads above 0.01% of any episode under 80 minutes), and bad sits at the median stream with 10% of its frames frozen.
  vision.frozen_frame_pct:
    thresholds:
      default:
        good: 0.01
        bad: 10.0

  # Candidate: the 10%/25% deviation bounds are unconfirmed against real
  # recordings.
  timing.effective_hz:
    mode: abs_dev  # grade |value - target| / |target| instead of value directly
    target: nominal_hz  # key looked up under this metric's own `limits`
    # an adapter's describe() naming a declared rate auto-fills the target
    # above from DatasetInfo.nominal_rate_hz, unless this file already set it
    target_source: nominal_rate_hz
    thresholds:
      default:
        good: 0.10
        bad: 0.25

  # Candidate: the percent bounds are unconfirmed against real recordings.
  integrity.missing_pct:
    thresholds:
      default:
        good: 0.5
        bad: 5.0

  # Candidate: the 1%/20% bounds are unconfirmed against real recordings;
  # even clean, regularly-sampled data can trip a 1% good bound on a short
  # recording, so the lower bound wants checking against longer ones.
  # Reward channels flatline legitimately until success, so they are
  # neutralised rather than graded against the default band.
  # Candidate, revised against real 50 Hz teleoperation (ALOHA static and mobile,
  # Unitree H1): joints and sensors there routinely hold still for 20-45% of an
  # episode while the operator pauses or an arm waits, which the earlier 1%/20%
  # band called "stuck" in nearly every episode. A stuck sensor is unchanged for
  # nearly the whole episode, so the band now sits there.
  integrity.flatline_pct:
    thresholds:
      default:
        good: 50.0
        bad: 90.0
      reward.frame_reward: {good: null, bad: null}
      reward.success_label: {good: null, bad: null}
      reward.value_score: {good: null, bad: null}
      reward.discount_flag: {good: null, bad: null}
      # Commands are not sensors: an operator pausing, an idle arm or an unused
      # action dimension holds a command still legitimately, so "unchanged" is not
      # "stuck". Found grading real LeRobot datasets, where action channels hit
      # this band in nearly every episode of five datasets out of six.
      action.action_vector: {good: null, bad: null}
      action.joint_position_command: {good: null, bad: null}
      action.joint_velocity_command: {good: null, bad: null}
      action.joint_torque_command: {good: null, bad: null}
      action.cartesian_pose_command: {good: null, bad: null}
      action.cartesian_twist_command: {good: null, bad: null}
      action.gripper_command: {good: null, bad: null}
      # A gripper holds open or closed for most of an episode: that is the task,
      # not a stuck sensor (ALOHA's grippers, holding a battery or a towel, read
      # 90-99% unchanged).
      proprio.gripper_width: {good: null, bad: null}
      action.base_velocity_command: {good: null, bad: null}

  # Candidate: default and joint-velocity bad bounds unconfirmed against real
  # recordings. Joint velocity now carries a two-sided band of its own; a
  # type-keyed band is never merged with the default.
  integrity.spike_pct:
    thresholds:
      default:
        good: 0.1
        bad: 2.0
      proprio.joint_velocity:
        good: 0.1
        bad: 2.0

  # Report-only by design: the documented threshold is a total change over
  # an episode, which this metric's per-minute unit cannot convert to
  # without a duration the policy does not hold.
  integrity.drift:
    report_only: true

  # Candidate: default and per-type bad bounds unconfirmed against real
  # recordings (the good bounds are the decided ones). Joint velocity and
  # joint acceleration now carry two-sided bands of their own; a type-keyed
  # band is never merged with the default.
  integrity.snr_db:
    higher_is_better: true
    thresholds:
      default:
        good: 30.0
        bad: 15.0
      # Motor-current (effort) channels are noisy by nature: real ALOHA arms read
      # 8-15 dB in every episode. Nothing yet separates a bad torque sensor from a
      # normal one, so the ratio is reported, not graded, like the other torque
      # metrics.
      proprio.joint_torque: {good: null, bad: null}
      # A gripper snaps between open and closed: the snap is exactly what this
      # ratio counts as noise (ALOHA grippers read -2 to 15 dB), so it is
      # reported, not graded. The spike check still grades a glitching gripper.
      proprio.gripper_width: {good: null, bad: null}
      action.gripper_command: {good: null, bad: null}
      proprio.joint_velocity:
        good: 20.0
        bad: 10.0
      proprio.joint_acceleration:
        good: 12.0
        bad: 6.0

  # Candidate: bad bound unconfirmed against real recordings.
  integrity.dead_taxel_pct:
    thresholds:
      default:
        good: 2.0
        bad: 10.0

  # Candidate: bad bound unconfirmed against real recordings.
  integrity.hysteresis:
    thresholds:
      default:
        good: 0.05
        bad: 0.20

  # Report-only until the metric is made dimensionless (docs/METRICS.md,
  # "Jerk metrics are report-only"). Dividing by each channel's spread removes
  # amplitude but not time, so the value carries units of 1/s^3: a perfectly
  # smooth 0.5 Hz joint motion measures ~44, far past this band. The candidate
  # band is kept on file so the numbers are not lost, but it does not grade.
  motion.mean_jerk_norm:
    report_only: true
    thresholds:
      default:
        good: 0.1
        bad: 0.5

  # Report-only for the same reason as mean_jerk_norm above.
  motion.max_abs_jerk:
    report_only: true
    thresholds:
      default:
        good: 0.1
        bad: 0.5

  # Report-only: no band is decided. One waits on the detector benchmark measuring
  # how often this fires on clean real recordings.
  motion.velocity_spike_pct:
    report_only: true

  # Report-only: dimensionless, unlike mean_jerk_norm, but no smoothness band has
  # been set against real recordings.
  motion.log_dimensionless_jerk:
    report_only: true

  # No bound decided; docs/METRICS.md marks it to define.
  motion.action_chatter: {}

  # The observed maximum is an estimate, not a declared limit;
  # the documented good < 1% band waits on a declared limit being wired in.
  motion.vel_saturation_pct:
    report_only: true

  # The observed range is an estimate, not a declared limit;
  # the documented band waits on a declared limit being wired in.
  motion.limit_proximity_pct:
    report_only: true

  # No bound decided; docs/METRICS.md marks it to define.
  motion.still_drift: {}

  # Candidate (low confidence): deliberate motion lives below ~5 Hz, so a large
  # share of torque energy above 20 Hz is mechanical. Bounds unconfirmed against
  # real recordings — validate before treating these as decided.
  motion.hf_vibration_ratio:
    thresholds:
      default:
        good: 0.1
        bad: 0.3

  # Report-only by design: what counts as high torque depends on the robot
  # and the task, not on a threshold this file could hold.
  motion.p99_torque:
    report_only: true

  motion.max_torque:
    report_only: true

  motion.mean_torque:
    report_only: true

  # Report-only by design.
  motion.energy_proxy:
    report_only: true

  # No bound decided; docs/METRICS.md marks it to define. Whether a missing
  # instruction should cost points depends on the policy being trained, so it
  # is measured and shown in every report and grades nothing until a band is
  # settled against real recordings.
  annotation.task_instruction_missing: {}

missing_family: skip

# The dataset gate (docs/METRICS.md, "The dataset gate"). Candidate: the rows
# were tested on twelve datasets — six synthetic with planted defects (the gate
# catches every planted spike episode and flags no clean one) and six LeRobot
# hub datasets — but are unconfirmed against labelled real-world failures.
# An episode fails on any critical finding that is not a task trait; the share
# of failing episodes caps the dataset's letter. The number stays the mean.
gate:
  caps:
    - {max_failing_share: 0.05, letter: null}  # a few odd episodes cost no letter
    - {max_failing_share: 0.15, letter: B}
    - {max_failing_share: 0.30, letter: C}
    - {max_failing_share: 1.0, letter: D}
  # A task needs this many episodes before a finding on all of them is read as
  # the task's own behaviour rather than a coincidence.
  task_trait_min_episodes: 20

letters:
  A: 90
  B: 80
  C: 70
  D: 60
