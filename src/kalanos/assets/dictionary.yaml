# dictionary.yaml — the taxonomy of signals Kalanos knows about.
#
# When adding an alias, reject it if it falls into one of these categories:
#
# - Too generic to safely claim on its own — a real column with this exact
#   name is more likely to mean something else than to mean this entry
#   (e.g. `path`, `status`, `value`).
# - Claimed by more than one type once normalised — neither claimant
#   keeps it, since taking the first would go unnoticed downstream
#   (e.g. `state`, claimed by both a bare column and LeRobot's
#   `observation.state`).
# - Compound — one cell naming more than one field at once (`voltage +
#   current`, `cam0/cam1`), which is not a single field name to match.
# - Names an example file rather than a field (`info.json`, `model.xml`).
#
# Entry types, in the order they appear below:
#
#   proprio     - sensing measured onboard the robot (joints, gripper, base)
#   extero      - cameras, depth, lidar, audio, touch, IMU
#   action      - commanded setpoints and controller configuration
#   derived     - computed from raw sensing, not measured directly
#   calib       - sensor geometry, timing offsets, calibration validity
#   embodiment  - the robot's own model, kinematics and identity
#   scene       - the world the robot is operating in
#   sim         - privileged state and settings that only exist in sim
#   task        - what the robot was asked to do, in natural language
#   annotation  - human- or model-added labels over the recording
#   reward      - success signals, benchmarks and eval results
#   provenance  - who/how/where a recording was collected
#   reference   - lookup tables tying IDs to paths, splits and stats
#   quality     - QC results, drift and anomaly reports
#   governance  - licensing, privacy and access controls
#   storage     - the container format the data is shipped in

