<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Kalanos: understand robot data before you train</title><desc id="desc">Open-source robotics dataset inspection, local by default. HTML for investigation; JSON for automation.</desc><rect width="1200" height="360" rx="20" fill="#f5f8fb"/>
<text x="44" y="52" fill="#00745f" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700">KALANOS / ROBOTICS DATA INSPECTION</text>
<text x="44" y="112" fill="#172b42" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700">Understand your robot data</text>
<text x="44" y="165" fill="#172b42" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700">before you train.</text>
<text x="44" y="213" fill="#4b6075" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Inspect recordings. Trace findings. Keep the evidence.</text>
<rect x="44" y="264" width="190" height="42" rx="21" fill="#e3f5ee" stroke="#b4d9cc"/>
<text x="62" y="292" fill="#00745f" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Local by default</text>
<rect x="250" y="264" width="180" height="42" rx="21" fill="#e3f5ee" stroke="#b4d9cc"/>
<text x="268" y="292" fill="#00745f" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Apache-2.0</text>
<rect x="446" y="264" width="200" height="42" rx="21" fill="#e3f5ee" stroke="#b4d9cc"/>
<text x="464" y="292" fill="#00745f" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">No model API</text>
<rect x="758" y="42" width="398" height="276" rx="12" fill="#ffffff" stroke="#d6e1e9"/>
<text x="784" y="82" fill="#00745f" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700">YOUR RECORDINGS → YOUR REPORT</text>
<circle cx="792" cy="117" r="4" fill="#00745f"/><text x="808" y="124" fill="#172b42" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400">Episode decisions</text>
<circle cx="792" cy="159" r="4" fill="#00745f"/><text x="808" y="166" fill="#172b42" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400">Measured evidence</text>
<circle cx="792" cy="201" r="4" fill="#00745f"/><text x="808" y="208" fill="#172b42" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400">Coverage &amp; scope</text>
<line x1="784" y1="235" x2="1130" y2="235" stroke="#d6e1e9"/><text x="784" y="273" fill="#172b42" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700">HTML + JSON</text>
<text x="784" y="296" fill="#4b6075" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">No automatic upload</text>
